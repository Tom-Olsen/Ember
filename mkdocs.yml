site_name: Ember Engine Docs
site_description: Architecture and API documentation for the Ember game engine
site_url: https://tom-olsen.github.io/Ember/
repo_url: https://github.com/Tom-Olsen/Ember
repo_name: Tom-Olsen/Ember
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/ssr-comparison.css

extra_javascript:
  - javascripts/ssr-comparison.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Preview:
      - Screen-Space-Reflections: preview/screen-space-reflections.md
      - Fluid Dynamics: preview/fluid-dynamics.md
  - Algorithms:
      - Bitonic Sort: algorithms/bitonic-sort.md
      - Smoothed Particle Hydrodynamics: algorithms/smoothed-particle-hydrodynamics.md
      - Lattice Boltzmann Method: algorithms/lattice-boltzmann-method.md
  - Vulkan Renderer:
      - Overview: vulkan-renderer/index.md
      - Frame Lifecycle and Render Graph: vulkan-renderer/frame-lifecycle.md
      - Rendering Pipeline: vulkan-renderer/rendering-pipeline.md
      - GPU Resources and Descriptors: vulkan-renderer/gpu-resources.md
      - Compute: vulkan-renderer/compute.md
      - Context and Lifetime: vulkan-renderer/context-and-lifetime.md