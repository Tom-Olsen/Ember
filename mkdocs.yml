site_name: Ember Engine Docs
site_description: Architecture and API documentation for the Ember game engine
site_url: https://tom-olsen.github.io/Ember/
repo_url: https://github.com/Tom-Olsen/Ember
repo_name: Tom-Olsen/Ember
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md